<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal Cabinet</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6f2eb,#171614);--surface:light-dark(#fffdf9,#211f1c);--surface2:light-dark(#f0ebe2,#2a2723);--text:light-dark(#29251f,#f4efe7);--muted:light-dark(#766e63,#aaa096);--line:light-dark(#ddd4c7,#3b3630);--accent:light-dark(#765e45,#c8a87a);--accent2:light-dark(#4e6657,#9bb69f);--danger:light-dark(#9b4c42,#e48b80);--shadow:0 14px 40px rgba(49,39,26,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{min-height:100vh;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1280px;margin:auto;padding:28px 24px 48px}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:26px}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:11px;color:var(--muted);font-weight:700}.brand h1{font:600 clamp(30px,4vw,46px)/1.05 Georgia,serif;margin:7px 0 6px}.brand p{margin:0;color:var(--muted);max-width:650px}.primary{background:var(--text);color:var(--bg);border:0;padding:12px 18px;border-radius:12px;font-weight:750;box-shadow:var(--shadow)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:25px;font-weight:750;margin-top:5px}.positive{color:var(--accent2)}.negative{color:var(--danger)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.search{flex:1;min-width:230px}.input,.select,.textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:11px 12px;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent)}.select{width:auto;min-width:150px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--surface);border:1px solid var(--line);border-radius:17px;overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s ease,box-shadow .15s ease}.card:hover{transform:translateY(-2px);box-shadow:0 18px 48px rgba(49,39,26,.13)}.photo{height:190px;background:linear-gradient(135deg,#d8c9b2,#ece4d8);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font:44px Georgia;color:#6c5947}.tag{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.82);color:#44382d;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800}.card-body{padding:14px}.card-title{font:600 20px Georgia,serif}.sub{color:var(--muted);font-size:12px;margin-top:2px}.card-row{display:flex;justify-content:space-between;gap:10px;margin-top:13px}.money{font-weight:800}.gain{font-size:11px;color:var(--accent2);margin-top:2px}.empty{border:1px dashed var(--line);border-radius:16px;padding:55px;text-align:center;color:var(--muted);grid-column:1/-1}.modal-wrap{position:fixed;inset:0;background:rgba(0,0,0,.48);display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal-wrap.open{display:flex}.modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:24px}.modal-head{display:flex;justify-content:space-between;gap:16px;align-items:start;margin-bottom:18px}.modal h2{font:600 29px Georgia,serif;margin:0}.close{border:1px solid var(--line);background:transparent;color:var(--text);border-radius:9px;width:36px;height:36px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}.full{grid-column:1/-1}.drop{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;background:var(--surface2)}.preview-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.thumb{width:74px;height:74px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.secondary{background:transparent;color:var(--text);border:1px solid var(--line);padding:10px 15px;border-radius:10px}.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger),transparent 55%)}.detail{display:grid;grid-template-columns:1.05fr .95fr;gap:20px}.hero-photo{height:330px;border-radius:15px;overflow:hidden;background:var(--surface2)}.hero-photo img{width:100%;height:100%;object-fit:cover}.detail h3{font:600 28px Georgia,serif;margin:0}.kv{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:15px}.kv div{padding:11px 0;border-bottom:1px solid var(--line)}.kv span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.valuation{background:var(--surface2);border-radius:15px;padding:18px;margin-top:15px}.valuation .big{font-size:32px;font-weight:850;margin:2px 0}.notice{font-size:11px;color:var(--muted);margin-top:7px}.smallbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:8px 11px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section-title h2{font:600 22px Georgia,serif;margin:0}.no-photo{display:flex;align-items:center;justify-content:center;height:100%;font-size:40px;color:var(--muted)}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}}@media(max-width:560px){.shell{padding:20px 14px 40px}.top{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.photo{height:220px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="modal-wrap" id="modalWrap"><div class="modal" id="modal"></div></div>
<script>
const KEY='crystal-cabinet-v2';
const COLLECTION_KEY='crystal-cabinet-collections-v1';
const MARKET_URL='https://earthwonders.com/market-data';
const defaultCollections=[{id:'personal',name:'Personal Collection',description:'My main crystal collection'}];
const demo=[
{id:'1',name:'Labradorite',type:'Polished freeform',mineral:'Labradorite',locality:'Madagascar',date:'2026-10-05',price:180,qty:1,size:'Medium',weight:86,condition:'Excellent',supplier:'ZA Minerals',notes:'Strong blue flash across the centre.',photos:[],value:null},
{id:'2',name:'Epidote on Quartz',type:'Matrix specimen',mineral:'Epidote + Quartz',locality:'Pakistan',date:'2026-09-20',price:420,qty:1,size:'Small',weight:72,condition:'Very good',supplier:'Topstones',notes:'Green epidote crystals on white quartz.',photos:[],value:null},
{id:'3',name:'Amethyst',type:'Cluster',mineral:'Quartz',locality:'Brazil',date:'2026-08-14',price:260,qty:1,size:'Medium',weight:310,condition:'Excellent',supplier:'Toprock',notes:'Deep purple points with good sparkle.',photos:[],value:null},
{id:'4',name:'Fluorite',type:'Cubic cluster',mineral:'Fluorite',locality:'China',date:'2026-07-08',price:650,qty:1,size:'Medium',weight:145,condition:'Excellent',supplier:'Absolute Quartz',notes:'Purple-green zoning and sharp cubes.',photos:[],value:null}
];
let collections=JSON.parse(localStorage.getItem(COLLECTION_KEY)||'null')||defaultCollections;
let activeCollection=localStorage.getItem('crystal-cabinet-active')||collections[0].id;
let crystals=JSON.parse(localStorage.getItem('crystals-'+activeCollection)||'null')|| (activeCollection===collections[0].id?(JSON.parse(localStorage.getItem(KEY)||'null')||demo):[]);
function collectionData(id=activeCollection){return JSON.parse(localStorage.getItem('crystals-'+id)||'null')|| (id===collections[0].id?crystals:[])}
function switchCollection(id){if(id===activeCollection)return;save();activeCollection=id;localStorage.setItem('crystal-cabinet-active',id);crystals=collectionData(id);render()}
function addCollection(){const name=prompt('Collection name');if(!name?.trim())return;const c={id:crypto.randomUUID(),name:name.trim(),description:''};collections.push(c);localStorage.setItem(COLLECTION_KEY,JSON.stringify(collections));switchCollection(c.id)}
function deleteCollection(){if(collections.length===1)return alert('You need at least one collection.');const c=collections.find(x=>x.id===activeCollection);if(!confirm('Delete the collection “'+c.name+'” and its specimens?'))return;localStorage.removeItem('crystals-'+activeCollection);collections=collections.filter(x=>x.id!==activeCollection);localStorage.setItem(COLLECTION_KEY,JSON.stringify(collections));switchCollection(collections[0].id)}
function autoType(c){const text=[c.name,c.mineral,c.notes].join(' ').toLowerCase();if(/tumbled|tumble/.test(text))return'Tumbled stone';if(/cabochon|cab/.test(text))return'Cabochon';if(/sphere|orb/.test(text))return'Sphere';if(/freeform/.test(text))return'Polished freeform';if(/polish|polished/.test(text))return'Polished';if(/geode/.test(text))return'Geode';if(/druzy|druse/.test(text))return'Druzy';if(/cluster/.test(text))return'Cluster';if(/matrix/.test(text))return'Matrix specimen';if(/tower|obelisk/.test(text))return'Tower';if(/point|terminated/.test(text))return'Crystal point';if(/carving|carved/.test(text))return'Carving';if(/slab/.test(text))return'Slab';return'Natural specimen'}
function save(){localStorage.setItem('crystals-'+activeCollection,JSON.stringify(crystals));if(activeCollection===collections[0].id)localStorage.setItem(KEY,JSON.stringify(crystals))}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function money(n){return new Intl.NumberFormat('en-ZA',{style:'currency',currency:'ZAR',maximumFractionDigits:0}).format(n||0)}
function valuation(c){
 const market={quartz:{rough:2.2,specimen:4.5,polished:3.8},amethyst:{rough:2.8,specimen:5.8,polished:4.5},labradorite:{rough:4.2,specimen:9.5,polished:7.5},fluorite:{rough:5.5,specimen:13,polished:8.5},epidote:{rough:4.5,specimen:11,polished:7},calcite:{rough:2.5,specimen:5.5,polished:4},tourmaline:{rough:8,specimen:22,polished:13},beryl:{rough:7,specimen:18,polished:12},opal:{rough:9,specimen:25,polished:16},default:{rough:3,specimen:6,polished:5}};
 const text=(c.name+' '+c.mineral).toLowerCase();let mineral='default';for(const k of Object.keys(market).filter(k=>k!=='default'))if(text.includes(k)){mineral=k;break}
 const type=String(c.type||'').toLowerCase();const form=/polish|tumbled|cabochon|freeform|sphere|carving/i.test(type)?'polished':/cluster|matrix|specimen|point|tower|geode|druze/i.test(type)?'specimen':'rough';
 const rate=market[mineral][form];const weight=Math.max(1,Number(c.weight)||Math.max(20,Number(c.price)||20)/3);
 const size={tiny:.7,small:.9,medium:1.08,large:1.3,'extra large':1.55}[String(c.size||'').toLowerCase()]||1;
 const cond={poor:.55,fair:.75,'very good':1,'excellent':1.12,pristine:1.25}[String(c.condition||'').toLowerCase()]||1;
 const locality=/madagascar|pakistan|afghanistan|peru|bolivia|morocco|namibia|tanzania|south africa|usa|mexico/i.test(c.locality||'')?1.08:1;
 const textQuality=(c.notes||'').toLowerCase();let feature=1;if(/rainbow|flash|chatoy|iridescen|phantom|inclusion|window|termination|druzy|sparkle/i.test(textQuality))feature=1.16;if(/exceptional|intense|neon|full flash|museum/i.test(textQuality))feature=1.28;
 const calculated=rate*weight*size*cond*locality*feature;const paid=Number(c.price)||0;const anchored=paid?Math.max(calculated,paid*.65):calculated;
 return Math.max(20,Math.round(anchored/10)*10);
}
function render(){
 const q=(window.search||'').toLowerCase();const filter=window.filter||'all';
 const list=crystals.filter(c=>(!q||[c.name,c.type,c.mineral,c.locality,c.supplier].join(' ').toLowerCase().includes(q))&&(filter==='all'||(filter==='valued'&&valuation(c)>0)||(filter==='high'&&valuation(c)>=1000)));
 const spent=crystals.reduce((a,c)=>a+(+c.price||0)*(+c.qty||1),0);const val=crystals.reduce((a,c)=>a+valuation(c)*(+c.qty||1),0);const gain=val-spent;const pct=spent?gain/spent*100:0;
 document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="eyebrow">Personal mineral archive</div><h1>Crystal Cabinet</h1><p>A private digital collection for your specimens, purchase history, photographs and automatically estimated current value.</p></div><button class="primary" onclick="openForm()">＋ Add crystal</button></header>
 <section class="stats"><div class="stat"><div class="label">Specimens</div><div class="value">${crystals.reduce((a,c)=>a+(+c.qty||1),0)}</div></div><div class="stat"><div class="label">Total invested</div><div class="value">${money(spent)}</div></div><div class="stat"><div class="label">Estimated collection value</div><div class="value">${money(val)}</div></div><div class="stat"><div class="label">Estimated gain</div><div class="value ${gain>=0?'positive':'negative'}">${gain>=0?'+':''}${money(gain)} <small>(${pct.toFixed(1)}%)</small></div></div></section>
 <div class="toolbar"><input class="input search" placeholder="Search crystal, mineral, locality or supplier…" value="${esc(window.search||'')}" oninput="window.search=this.value;render()"><select class="select" onchange="window.filter=this.value;render()"><option value="all" ${filter==='all'?'selected':''}>All specimens</option><option value="valued" ${filter==='valued'?'selected':''}>Valued</option><option value="high" ${filter==='high'?'selected':''}>R1,000+ value</option></select></div>
 <div class="section-title"><h2>Your collection</h2><span class="eyebrow">Automatic estimates</span></div><section class="grid">${list.length?list.map(card).join(''):'<div class="empty">No specimens match your search.<br><button class="smallbtn" style="margin-top:12px" onclick="openForm()">Add your first crystal</button></div>'}</section></div>`;
}
function card(c){const v=valuation(c),g=v-(+c.price||0);return `<article class="card" onclick="openDetail('${c.id}')"><div class="photo">${c.photos?.[0]?`<img src="${c.photos[0]}" alt="${esc(c.name)}">`:'<div class="placeholder">◇</div>'}<span class="tag">${esc(c.type||'Specimen')}</span></div><div class="card-body"><div class="card-title">${esc(c.name)}</div><div class="sub">${esc(c.locality||'Unknown locality')} · ${esc(c.size||'Unspecified')}</div><div class="card-row"><div><div class="money">${money(v)}</div><div class="gain">${g>=0?'+':''}${money(g)} vs purchase</div></div><div class="sub">paid ${money(c.price)}</div></div></div></article>`}
function openForm(id){const c=id?crystals.find(x=>x.id===id):{};pendingPhotos=[...(c.photos||[])];document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">${id?'Edit specimen':'New specimen'}</div><h2>${id?'Update crystal':'Add a crystal'}</h2></div><button type="button" class="close" onclick="closeModal()">×</button></div><form id="crystalForm"><div class="form-grid">
${field('name','Crystal name',c.name,true)}<div class="field"><label>Type</label><div class="input" style="color:var(--muted)">Automatically detected</div></div>${field('mineral','Mineral',c.mineral)}${field('locality','Locality / origin',c.locality)}${field('date','Date purchased',c.date||new Date().toISOString().slice(0,10),'', 'date')}${field('price','Purchase price (R)',c.price,'','number', '0.01')}${field('qty','Quantity',c.qty||1,'','number','1')}${field('size','Size',c.size)}${field('weight','Weight (g)',c.weight,'','number','0.01')}${field('condition','Condition',c.condition)}${field('supplier','Supplier / seller',c.supplier)}<div class="field full"><label>Notes</label><textarea class="textarea" name="notes" rows="3">${esc(c.notes||'')}</textarea></div><div class="field full"><label>Crystal photos</label><div class="drop"><input id="photos" type="file" accept="image/*" capture="environment" multiple onchange="previewFiles(event)"><div style="margin-top:10px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button type="button" class="smallbtn" onclick="document.getElementById('photos').click()">📷 Take photo / choose photos</button><button type="button" class="smallbtn" onclick="identifyCurrentPhoto()">✨ Analyze photos</button></div><div class="notice">Upload up to 8 photos. AI will use the photos together to suggest the mineral, specimen type and visible features.</div><div class="preview-row" id="previews">${(c.photos||[]).map(p=>`<img class="thumb" src="${p}">`).join('')}</div></div></div></div><div class="valuation"><div class="eyebrow">Automatic estimate</div><div class="big" id="liveValue">${money(valuation(c))}</div><div class="notice">Calculated from mineral/type, size, weight, condition, locality and specimen features. This is an estimate, not a professional appraisal.</div></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancel</button>${id?`<button type="button" class="secondary danger" onclick="deleteCrystal('${id}')">Delete</button>`:''}<button class="primary" id="saveCrystalBtn" type="submit">Save crystal</button></div></form>`;document.getElementById('modalWrap').classList.add('open');document.getElementById('crystalForm').addEventListener('submit',e=>submitCrystal(e,id));}
function field(n,label,v='',req=false,type='text',step=''){return `<div class="field"><label>${label}</label><input class="input" name="${n}" type="${type}" ${step?`step="${step}"`:''} value="${esc(v)}" ${req?'required':''}></div>`}
let pendingPhotos=[];function previewFiles(e){const files=[...e.target.files].slice(0,8);const out=document.getElementById('previews');out.innerHTML='';pendingPhotos=[];files.forEach(f=>{const r=new FileReader();r.onload=()=>{pendingPhotos.push(r.result);out.innerHTML+=`<img class="thumb" src="${r.result}" alt="Crystal photo">`};r.readAsDataURL(f)})}
function identifyCurrentPhoto(){if(!pendingPhotos.length)return alert('Take or choose at least one crystal photo first.');document.getElementById('modal').insertAdjacentHTML('beforeend',`<div class="valuation" id="aiBox"><div class="eyebrow">AI identification</div><div style="font-size:18px;font-weight:750">${pendingPhotos.length} photo${pendingPhotos.length===1?'':'s'} ready ✓</div><div class="notice">The photos are ready for vision analysis. To make identification actually work from your published GitHub app, connect a secure serverless AI endpoint and keep the API key there — never inside this page. The endpoint can return a mineral suggestion, confidence, specimen type, colour, crystal habit, visible features, locality clues and alternative identifications.</div><div class="actions" style="margin-top:12px"><button type="button" class="secondary" onclick="document.getElementById('aiBox')?.remove()">Close</button><button type="button" class="smallbtn" onclick="alert('The next connection will send all selected photos together for analysis and then place the suggestions into the form for you to approve.')">How will this work?</button></div></div>`)}
function submitCrystal(e,id){e.preventDefault();const f=new FormData(e.target),old=id?crystals.find(x=>x.id===id):null;const c={id:id||crypto.randomUUID(),name:String(f.get('name')||'Unnamed specimen').trim(),mineral:String(f.get('mineral')||'').trim(),locality:String(f.get('locality')||'').trim(),date:f.get('date'),price:+f.get('price')||0,qty:+f.get('qty')||1,size:f.get('size'),weight:+f.get('weight')||0,condition:f.get('condition'),supplier:String(f.get('supplier')||'').trim(),notes:String(f.get('notes')||'').trim(),photos:pendingPhotos.length?pendingPhotos:(old?.photos||[])};c.type=autoType(c);if(id)crystals=crystals.map(x=>x.id===id?c:x);else crystals.unshift(c);pendingPhotos=[];save();closeModal();render()}
function openDetail(id){const c=crystals.find(x=>x.id===id),v=valuation(c),g=v-(+c.price||0);document.getElementById('modal').innerHTML=`<div class="modal-head"><div><div class="eyebrow">Specimen record</div><h2>${esc(c.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="detail"><div><div class="hero-photo">${c.photos?.[0]?`<img src="${c.photos[0]}" alt="${esc(c.name)}">`:'<div class="no-photo">◇</div>'}</div>${c.photos?.length>1?`<div class="preview-row">${c.photos.map(p=>`<img class="thumb" src="${p}">`).join('')}</div>`:''}</div><div><h3>${esc(c.name)}</h3><div class="sub">${esc(c.type||'')} · ${esc(c.locality||'Unknown locality')}</div><div class="valuation"><div class="eyebrow">Automatic current estimate</div><div class="big">${money(v)}</div><div class="${g>=0?'positive':'negative'}">${g>=0?'+':''}${money(g)} vs purchase (${((g/(+c.price||1))*100).toFixed(1)}%)</div><div class="notice">Estimate only — not a professional appraisal.</div></div><div class="kv">${kv('Purchased',c.date||'—')}${kv('Paid',money(c.price))}${kv('Quantity',c.qty||1)}${kv('Size',c.size||'—')}${kv('Weight',c.weight?c.weight+' g':'—')}${kv('Condition',c.condition||'—')}${kv('Supplier',c.supplier||'—')}${kv('Mineral',c.mineral||'—')}</div><div class="notice" style="margin-top:14px">${esc(c.notes||'No notes added.')}</div></div></div><div class="actions"><button class="secondary" onclick="closeModal()">Close</button><button class="primary" onclick="openForm('${c.id}')">Edit specimen</button></div>`;document.getElementById('modalWrap').classList.add('open')}
function kv(k,v){return `<div><span>${k}</span>${esc(v)}</div>`}function closeModal(){document.getElementById('modalWrap').classList.remove('open');pendingPhotos=[]}function deleteCrystal(id){if(confirm('Delete this specimen from your collection?')){crystals=crystals.filter(c=>c.id!==id);save();closeModal();render()}}document.getElementById('modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});render();
</script>
</body></html>
